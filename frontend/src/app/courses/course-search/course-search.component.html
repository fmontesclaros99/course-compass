<section class="space-y-6">
  <h2 class="text-xl font-semibold">Find a course</h2>

  <div class="grid gap-4 rounded-lg border border-gray-200 bg-white p-4 shadow-sm sm:grid-cols-[1fr_12rem]">
    <label class="flex flex-col gap-1 text-sm font-medium">
      Search
      <input
        #search
        type="search"
        class="rounded-md border border-gray-300 px-3 py-2 font-normal focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
        placeholder="Title contains…"
        [value]="text()"
        (input)="text.set(search.value)"
      />
    </label>

    <label class="flex flex-col gap-1 text-sm font-medium">
      Level
      <select
        #levelSelect
        class="rounded-md border border-gray-300 bg-white px-3 py-2 font-normal focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
        (change)="onLevelChange(levelSelect.value)"
      >
        <option value="">All levels</option>
        @for (option of levels; track option) {
          <option [value]="option">{{ levelLabel(option) }}</option>
        }
      </select>
    </label>
  </div>

  @let current = state();
  @if (current.status === 'loading') {
    <p role="status" class="text-gray-600">Loading courses…</p>
  } @else if (current.status === 'error') {
    <p role="alert" class="rounded-md border border-red-200 bg-red-50 px-4 py-3 text-red-700">
      {{ current.error.message }}
    </p>
  } @else {
    <app-course-list class="block" [courses]="results()" (selected)="openCourse($event)" />
  }
</section>
